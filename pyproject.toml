[project]
name = "wotiti"
version = "2.5.0"
description = "Small UI to track worktime"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "grenzenloseSchublade", email = "hans.mueller@rub.de" }]
dependencies = [
    "polars>=1,<2",
    "holidays>=0.50",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pre-commit",
    "pyinstaller>=6.12.0",
]
stats = [
    # numpy wird in stats_calculations direkt importiert — explizit deklarieren
    # statt sich auf den transitiven Zug über scipy/scikit-learn zu verlassen.
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "statsmodels>=0.13.5",
    "plotly>=5.0.0",
    "dash>=2.18.2",
    "dash_bootstrap_components>=1.7.1",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flache Module unter src/ (kein Paketordner src/wotiti): src/-Präfix wird
# abgestreift, die Module landen top-level im Wheel — genau wie sie zur
# Laufzeit importiert werden (pythonpath = ["src"]).
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["app", "db_helper", "single_instance", "utils", "stats_calculations", "stats_dashboard", "stats_generator", "stats_plotting"]
